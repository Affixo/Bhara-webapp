name: bhara_mobile
description: "Bhara - To-Let Rental Platform Mobile Application for Bangladesh"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  provider: ^6.1.2
  go_router: ^14.0.0

  # Networking & Storage
  dio: ^5.4.1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Media & Images
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Maps & Geolocation
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0

  # UI, Icons & Polish
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
